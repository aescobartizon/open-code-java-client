version: "3.9"

services:
  opencode:
    image: anescobar/opencode-server:1.0.0
    container_name: opencode-server
    restart: unless-stopped

    ports:
      - "4096:4096"

    #environment:
      # OPENCODE_SERVER_PASSWORD: "opencode"
      # OPENCODE_SERVER_USERNAME: "opencode"  # opcional

    volumes:
      # Configuración de OpenCode (persistente en Windows)
      - "/.opencode:/home/opencode/.config/opencode"

      # (Opcional) Directorio de trabajo
      #- "/home/vant/Documentos/Agentes IA/opencode/workspaces:/workspaces"

    command: >
      opencode serve
      --hostname 0.0.0.0
      --port 4096
